[project]
name = "mrpack2curseforge"
version = "0.22.0"
description = "Converte modpacks .mrpack para o CurseForge e atualiza seus mods."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "httpx>=0.28",
    "typer>=0.16",
    "rich>=14.0",
    "pydantic>=2.11",
    "python-dotenv>=1.2.2",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
]

[project.scripts]
mrpack2curseforge = "mrpack2curseforge.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrpack2curseforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
